services:
  db_mariadb:
    image: mariadb:11.4
    container_name: db_mariadb
    restart: unless-stopped
    ports: ["3306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - ./mariadb_data:/var/lib/mysql
      - ./configs/mariadb/init_mariadb.sql:/docker-entrypoint-initdb.d/init.sql
    command: --bind-address=0.0.0.0

  db_postgres:
    image: postgres:18-alpine
    container_name: db_postgres
    restart: unless-stopped
    ports: ["5432:5432"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: nodo_admin
      POSTGRES_DB: nodo_db
    volumes:
      - ./postgres_data:/var/lib/postgresql
      # AUTOMATIZACIÓN: Pasamos la carpeta para que cree esquemas o usuarios extras al volar limpio
      - ./configs/postgres:/docker-entrypoint-initdb.d
    command: ["postgres", "-c", "listen_addresses=*"]

  db_mongo:
    image: mongo:latest
    container_name: db_mongo
    restart: unless-stopped
    ports: ["27017:27017"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - ./mongo_data:/data/db

  auth_redis:
    image: redis:alpine
    container_name: auth_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--bind", "0.0.0.0"]
