---
- name: Instalación y Configuración Automática de Nodo DB Core
  hosts: all
  become: yes
  tasks:
    - name: FASE 1 - Instalacion de Docker y dependencias
      apt:
        name:
          - docker.io
          - docker-compose
          - python3-pip
          - curl
          - git
        state: present
        update_cache: yes

    - name: FASE 3 - Creacion de carpetas de datos
      file:
        path: "/opt/servicios/nodo-db-core/{{ item }}"
        state: directory
        mode: '0755'
        owner: "1000"
        group: "1000"
      with_items:
        - db_data
        - postgres_data
        - mongo_data

    - name: FASE 4.2 - Pull de imagenes
      shell: "docker pull {{ item }}"
      with_items:
        - "mariadb:11.4"
        - "postgres:18-alpine"
        - "mongo:latest"

    - name: FASE 5 - Levantar los contenedores
      shell: "cd /opt/servicios/nodo-db-core && docker compose up -d"

    - name: FASE 5.1 - Esperar a que Postgres este listo
      pause:
        seconds: 20

    - name: FASE 5.2 - Crear base de datos para Zabbix en Postgres
      shell: |
        docker exec db_postgres psql -U nodo_admin -d nodo_db -c "CREATE DATABASE zabbix_db;"
      ignore_errors: yes
