---
- name: Instalación y Configuración Automática de Nodo DB Core
  hosts: all
  become: yes
  tasks:
    - name: FASE 1 - Instalacion de Docker y dependencias
      apt:
        name:
          - docker.io
          - docker-compose
          - python3-pip
          - curl
          - git
        state: present
        update_cache: yes

    - name: FASE 2 - Creacion de carpetas de datos con permisos base
      file:
        path: "/opt/servicios/nodo-db-core/{{ item }}"
        state: directory
        mode: '0755'
        owner: "1000"
        group: "1000"
      with_items:
        - db_data
        - mongo_data
        - configs/postgres
        # --- ESTRUCTURA AUTOMÁTICA DE BACKUPS MAESTROS ---
        - backups
        - backups/mariadb
        - backups/mariadb/wordpress
        - backups/mariadb/glpi
        - backups/mariadb/n8n
        - backups/postgres
        - backups/postgres/zabbix
        - backups/mongo

    - name: FASE 3 - Permisos especificos para Postgres (ID 70)
      file:
        path: "/opt/servicios/nodo-db-core/postgres_data"
        state: directory
        owner: "70"
        group: "70"
        mode: '0700'

    - name: FASE 4 - Sincronizar Inicialización de Zabbix (¡Automatizado Manual!)
      # Esto copia el script que crea la DB de Zabbix antes de que encienda el motor
      copy:
        src: "../configs/postgres/init_zabbix.sql"
        dest: "/opt/servicios/nodo-db-core/configs/postgres/init_zabbix.sql"
        mode: '0644'

    - name: FASE 5 - Pull de imagenes
      shell: "docker pull {{ item }}"
      with_items:
        - "mariadb:11.4"
        - "postgres:18-alpine"
        - "mongo:latest"

    - name: FASE 6 - Levantar los contenedores
      shell: "cd /opt/servicios/nodo-db-core && docker compose up -d"
