services:
  db_mariadb:
    image: mariadb:11.4
    container_name: db_mariadb
    restart: unless-stopped
    ports: ["3306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_PASSWORD}
    networks:
      - nodo_net
    volumes:
      - ./mariadb_data:/var/lib/mysql
      - ./configs/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql

  db_postgres:
    image: postgres:18-alpine
    container_name: db_postgres
    restart: unless-stopped
    ports: ["5432:5432"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - nodo_net
    volumes:
      - ./postgres_data:/var/lib/postgresql
      # AUTOMATIZACIÓN: Pasamos la carpeta para que cree esquemas o usuarios extras al volar limpio
      - ./configs/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: ["postgres", "-c", "listen_addresses=*"]

  db_mongo:
    image: mongo:latest
    container_name: db_mongo
    restart: unless-stopped
    ports: ["27017:27017"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    networks:
      - nodo_net
    volumes:
      - ./mongo_data:/data/db
      - ./configs/mongo/init.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
  auth_redis:
    image: redis:alpine
    container_name: auth_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - nodo_net
    command: ["redis-server", "--bind", "0.0.0.0"]

networks:
  nodo_net:
    driver: bridge
