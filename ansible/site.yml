---
- name: Instalación y Configuración Automática de Nodo DB Core
  hosts: all
  become: yes
  tasks:
    - name: FASE 1 - Instalación de Docker y dependencias
      apt:
        name: [docker.io, docker-compose-v2, python3-pip]
        state: present
        update_cache: yes

    - name: FASE 3 - Creación de carpetas de datos con permisos correctos
      file:
        path: "/opt/servicios/nodo-db-core/{{ item }}"
        state: directory
        mode: '0755'
        owner: 1000
        group: 1000
      with_items: [db_data, postgres_data, mongo_data]

    - name: FASE 4.2 - Pull de imágenes (Pre-descarga secuencial)
      shell: "docker pull {{ item }}"
      with_items:
        - "mariadb:11.4"
        - "postgres:18-alpine"
        - "mongo:latest"

    - name: FASE 5 - Levantar los contenedores
      shell: "cd /opt/servicios/nodo-db-core && docker compose up -d"

    - name: Post-Despliegue - Configurar PostgreSQL para Zabbix
      pause:
        seconds: 20

    - name: Crear base de datos Zabbix en Postgres
      shell: |
        docker exec db_postgres psql -U nodo_admin -d nodo_db -c "CREATE DATABASE zabbix_db;"
      ignore_errors: yes
